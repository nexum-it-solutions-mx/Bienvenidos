  <!-- Fuentes tipográficas e Iconografía -->
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <style>
    :root {
      --bg-dark-top: #0a101d;
      --bg-dark-bottom: #060a12;
      --card-bg: rgba(13, 23, 38, 0.78);
      --card-border: rgba(0, 210, 255, 0.22);
      --cyan-neon: #00d2ff;
      --blue-electric: #1e6bf5;
      --silver-main: #e2e8f0;
      --silver-muted: #94a3b8;
      --glow-cyan: 0 0 24px rgba(0, 210, 255, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Outfit', sans-serif;
    }

    body {
      background-color: var(--bg-dark-top);
      background-image: 
        radial-gradient(ellipse at 50% 8%, rgba(30, 107, 245, 0.28) 0%, transparent 65%),
        radial-gradient(circle at 15% 85%, rgba(0, 210, 255, 0.08) 0%, transparent 50%),
        linear-gradient(180deg, var(--bg-dark-top) 0%, var(--bg-dark-bottom) 100%);
      color: var(--silver-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 16px 50px;
    }

    .container {
      width: 100%;
      max-width: 920px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ========================================================
       TOP / HEADER CON LOGOTIPO EMBEBIDO VECTORIAL
       ======================================================== */
    header {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 30px;
      text-align: center;
    }

    .logo-hero-wrapper {
      width: 100%;
      max-width: 780px;
      padding: 10px 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .brand-svg-logo {
      width: 100%;
      height: auto;
      max-height: 120px;
      filter: drop-shadow(0 6px 18px rgba(0, 210, 255, 0.25));
    }

    .brand-tagline-sub {
      margin-top: 14px;
      font-size: 0.98rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--cyan-neon);
      font-weight: 600;
      text-shadow: 0 0 10px rgba(0, 210, 255, 0.4);
    }

    /* ========================================================
       LÍNEAS Y MENÚ DE PESTAÑAS
       ======================================================== */
    .circuit-separator {
      width: 80%;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--cyan-neon), transparent);
      box-shadow: 0 0 12px var(--cyan-neon);
      margin: 18px 0 28px;
    }

    .nav-tabs {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      width: 100%;
      margin-bottom: 28px;
    }

    .nav-tabs .tab-btn {
      background: rgba(14, 25, 42, 0.7);
      border: 1px solid var(--card-border);
      color: var(--silver-muted);
      padding: 13px 20px;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      backdrop-filter: blur(10px);
    }

    .nav-tabs .tab-btn i {
      font-size: 1.15rem;
      color: var(--silver-muted);
      transition: color 0.3s;
    }

    .nav-tabs .tab-btn:hover {
      color: #ffffff;
      border-color: var(--cyan-neon);
      box-shadow: var(--glow-cyan);
      transform: translateY(-2px);
    }

    .nav-tabs .tab-btn:hover i {
      color: var(--cyan-neon);
    }

    .nav-tabs .tab-btn.active {
      background: linear-gradient(135deg, rgba(30, 107, 245, 0.4), rgba(0, 210, 255, 0.22));
      border-color: var(--cyan-neon);
      color: #ffffff;
      box-shadow: 0 0 20px rgba(0, 210, 255, 0.45);
    }

    .nav-tabs .tab-btn.active i {
      color: var(--cyan-neon);
      text-shadow: 0 0 8px var(--cyan-neon);
    }
