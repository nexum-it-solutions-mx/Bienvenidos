<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obtener Place ID - Nexum</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { display: flex; flex-direction: column; height: 100vh; background: #f4f6f8; }
        .header-bar { display: flex; align-items: center; justify-content: space-between; background: #1a2332; color: #fff; padding: 12px 24px; z-index: 10; }
        .btn-back { background: #0088ff; color: #fff; text-decoration: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; transition: background 0.2s; }
        .btn-back:hover { background: #0066cc; }
        .container { display: flex; flex: 1; position: relative; height: calc(100vh - 60px); }
        #map { flex: 1; height: 100%; }
        .sidebar { width: 380px; background: #fff; padding: 24px; box-shadow: -2px 0 10px rgba(0,0,0,0.1); z-index: 5; display: flex; flex-direction: column; gap: 16px; }
        .search-container { position: absolute; top: 15px; left: 15px; z-index: 10; background: #fff; padding: 6px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.3); }
        #pac-input { width: 320px; padding: 10px; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; outline: none; }
        .info-card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
        
        .field-group { display: flex; flex-direction: column; gap: 4px; }
        .field-group label { font-size: 0.85rem; font-weight: 600; color: #334155; }
        
        .place-id-box { background: #e0f2fe; border: 1px dashed #0284c7; padding: 8px 10px; border-radius: 6px; font-family: monospace; color: #0369a1; word-break: break-all; user-select: all; font-size: 0.9rem; }
        
        .url-box-container { display: flex; gap: 6px; align-items: center; }
        .url-input { flex: 1; padding: 8px; font-size: 0.85rem; border: 1px solid #cbd5e1; border-radius: 6px; background: #fff; color: #1e293b; outline: none; }
        .btn-copy { background: #10b981; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.85rem; transition: background 0.2s; }
        .btn-copy:hover { background: #059669; }
        
        .review-link { display: inline-block; color: #0284c7; font-weight: bold; text-decoration: none; font-size: 0.9rem; }
        .review-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="header-bar">
        <h2>Obtener Place ID</h2>
        <a href="index.html" class="btn-back">&larr; Volver al Inicio</a>
    </div>

    <div class="container">
        <!-- Campo de búsqueda -->
        <div class="search-container">
            <input id="pac-input" type="text" placeholder="Escribe el nombre del negocio...">
        </div>

        <!-- Mapa -->
        <div id="map"></div>

        <!-- Panel lateral -->
        <div class="sidebar">
            <div class="info-card">
                <div>
                    <h3 id="place-name">Busca un negocio...</h3>
                    <p id="place-address" style="color: #64748b; font-size: 0.85rem; margin-top: 4px;"></p>
                </div>

                <div class="field-group">
                    <label>Place ID:</label>
                    <div class="place-id-box" id="place-id">Aún no seleccionado</div>
                </div>

                <div class="field-group" id="url-group" style="display: none;">
                    <label>URL Directa de Reseña (NFC / QR):</label>
                    <div class="url-box-container">
                        <input type="text" id="review-url-input" class="url-input" readonly>
                        <button class="btn-copy" onclick="copyUrl()">Copiar</button>
                    </div>
                </div>

                <a id="review-url" href="#" target="_blank" class="review-link" style="display: none;">🔗 Abrir enlace de prueba</a>
            </div>
        </div>
    </div>

    <script>
        function initMap() {
            const defaultLocation = { lat: 20.6597, lng: -103.3496 }; // Guadalajara
            const map = new google.maps.Map(document.getElementById("map"), {
                center: defaultLocation,
                zoom: 13,
            });

            const input = document.getElementById("pac-input");
            const autocomplete = new google.maps.places.Autocomplete(input, {
                fields: ["place_id", "geometry", "name", "formatted_address"]
            });

            autocomplete.bindTo("bounds", map);

            const marker = new google.maps.Marker({
                map: map,
                anchorPoint: new google.maps.Point(0, -29)
            });

            function updateUI(name, address, placeId, location) {
                if (location) {
                    map.setCenter(location);
                    map.setZoom(17);
                    marker.setPosition(location);
                    marker.setVisible(true);
                }

                document.getElementById("place-name").textContent = name || "Sin nombre";
                document.getElementById("place-address").textContent = address || "";
                document.getElementById("place-id").textContent = placeId || "No disponible";

                if (placeId) {
                    // URL directa de reseñas
                    const fullReviewUrl = `https://search.google.com/local/writereview?placeid=${placeId}`;
                    
                    // Actualizar campo de texto y botón
                    document.getElementById("review-url-input").value = fullReviewUrl;
                    document.getElementById("url-group").style.display = "flex";

                    // Enlace de prueba
                    const reviewLink = document.getElementById("review-url");
                    reviewLink.href = fullReviewUrl;
                    reviewLink.style.display = "inline-block";
                }
            }

            // Al seleccionar en el buscador
            autocomplete.addListener("place_changed", () => {
                marker.setVisible(false);
                const place = autocomplete.getPlace();

                if (!place || !place.geometry || !place.geometry.location) {
                    alert("No se encontraron detalles para este lugar.");
                    return;
                }

                updateUI(place.name, place.formatted_address, place.place_id, place.geometry.location);
            });

            // Al hacer clic sobre un punto en el mapa
            map.addListener("click", (event) => {
                if (event.placeId) {
                    event.stop();
                    const service = new google.maps.places.PlacesService(map);
                    service.getDetails({ placeId: event.placeId }, (result, status) => {
                        if (status === google.maps.places.PlacesServiceStatus.OK && result) {
                            updateUI(result.name, result.formatted_address, result.place_id, result.geometry.location);
                        }
                    });
                }
            });
        }

        // Función para copiar la URL al portapapeles
        function copyUrl() {
            const input = document.getElementById("review-url-input");
            input.select();
            input.setSelectionRange(0, 99999); // Para dispositivos móviles
            navigator.clipboard.writeText(input.value);

            const btn = document.querySelector(".btn-copy");
            const originalText = btn.textContent;
            btn.textContent = "¡Copiado!";
            btn.style.background = "#059669";

            setTimeout(() => {
                btn.textContent = originalText;
                btn.style.background = "#10b981";
            }, 2000);
        }
    </script>

    <!-- Carga de la API de Google Maps -->
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyD4wKfBlYgwZql-jY6UBvRihfy4bEXYtus&libraries=places&callback=initMap" async defer></script>
</body>
</html>
