<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obtener Place ID - Nexum</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { display: flex; flex-direction: column; height: 100vh; background: #f4f6f8; }
        .header-bar { display: flex; align-items: center; justify-content: space-between; background: #1a2332; color: #fff; padding: 12px 24px; z-index: 10; }
        .btn-back { background: #0088ff; color: #fff; text-decoration: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; }
        .container { display: flex; flex: 1; position: relative; height: calc(100vh - 60px); }
        #map { flex: 1; height: 100%; }
        .sidebar { width: 360px; background: #fff; padding: 24px; box-shadow: -2px 0 10px rgba(0,0,0,0.1); z-index: 5; }
        .search-container { position: absolute; top: 15px; left: 15px; z-index: 10; background: #fff; padding: 8px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.3); }
        #pac-input { width: 320px; padding: 10px; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; outline: none; }
        .info-card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 16px; }
        .place-id-box { background: #e0f2fe; border: 1px dashed #0284c7; padding: 10px; border-radius: 6px; font-family: monospace; color: #0369a1; word-break: break-all; margin-top: 6px; user-select: all; }
        .review-link { display: inline-block; margin-top: 12px; color: #0284c7; font-weight: bold; text-decoration: none; }
        .review-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="header-bar">
        <h2>Obtener Place ID</h2>
        <a href="index.html" class="btn-back">&larr; Volver al Inicio</a>
    </div>

    <div class="container">
        <!-- Input buscador dentro del mapa -->
        <div class="search-container">
            <input id="pac-input" type="text" placeholder="Escribe el nombre del negocio...">
        </div>

        <!-- Contenedor del Mapa -->
        <div id="map"></div>

        <!-- Panel lateral para mostrar los datos -->
        <div class="sidebar">
            <div class="info-card">
                <h3 id="place-name">Busca un negocio...</h3>
                <p id="place-address" style="color: #64748b; font-size: 0.85rem; margin-top: 6px; margin-bottom: 12px;"></p>
                <label style="font-size: 0.85rem; font-weight: 600; color: #334155;">Place ID del negocio:</label>
                <div class="place-id-box" id="place-id">Aún no seleccionado</div>
                <a id="review-url" href="#" target="_blank" class="review-link" style="display: none;">🔗 Probar enlace de reseña</a>
            </div>
        </div>
    </div>

    <script>
        function initMap() {
            // Ubicación inicial por defecto
            const defaultLocation = { lat: 20.6597, lng: -103.3496 };
            const map = new google.maps.Map(document.getElementById("map"), {
                center: defaultLocation,
                zoom: 13,
            });

            const input = document.getElementById("pac-input");
            const autocomplete = new google.maps.places.Autocomplete(input);
            autocomplete.bindTo("bounds", map);

            const marker = new google.maps.Marker({
                map: map,
                anchorPoint: new google.maps.Point(0, -29),
            });

            autocomplete.addListener("place_changed", () => {
                marker.setVisible(false);
                const place = autocomplete.getPlace();

                if (!place.geometry || !place.geometry.location) {
                    alert("No se encontraron detalles para la ubicación seleccionada.");
                    return;
                }

                if (place.geometry.viewport) {
                    map.fitBounds(place.geometry.viewport);
                } else {
                    map.setCenter(place.geometry.location);
                    map.setZoom(17);
                }

                marker.setPosition(place.geometry.location);
                marker.setVisible(true);

                // Asignar los datos recopilados al panel lateral
                document.getElementById("place-name").textContent = place.name || "";
                document.getElementById("place-address").textContent = place.formatted_address || "";
                document.getElementById("place-id").textContent = place.place_id || "";

                if (place.place_id) {
                    const reviewUrl = `https://search.google.com/local/writereview?placeid=${place.place_id}`;
                    const reviewLink = document.getElementById("review-url");
                    reviewLink.href = reviewUrl;
                    reviewLink.style.display = "inline-block";
                }
            });
        }
    </script>

    <!-- Reemplaza TU_API_KEY con tu clave de API -->
    <script src="https://maps.googleapis.com/maps/api/js?key=TU_API_KEY&libraries=places&callback=initMap" async defer></script>
</body>
</html>
