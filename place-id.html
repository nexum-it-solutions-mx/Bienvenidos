<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obtener Place ID - Nexum</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { display: flex; flex-direction: column; height: 100vh; background: #f4f6f8; }
        .header-bar { display: flex; align-items: center; justify-content: space-between; background: #1a2332; color: #fff; padding: 12px 24px; z-index: 10; }
        .btn-back { background: #0088ff; color: #fff; text-decoration: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; transition: background 0.2s; }
        .btn-back:hover { background: #0066cc; }
        .container { display: flex; flex: 1; position: relative; height: calc(100vh - 60px); }
        #map { flex: 1; height: 100%; }
        .sidebar { width: 360px; background: #fff; padding: 24px; box-shadow: -2px 0 10px rgba(0,0,0,0.1); z-index: 5; display: flex; flex-direction: column; gap: 16px; }
        .search-container { position: absolute; top: 15px; left: 15px; z-index: 10; background: #fff; padding: 6px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.3); }
        .info-card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 16px; }
        .place-id-box { background: #e0f2fe; border: 1px dashed #0284c7; padding: 10px; border-radius: 6px; font-family: monospace; color: #0369a1; word-break: break-all; margin-top: 6px; user-select: all; font-size: 0.95rem; }
        .review-link { display: inline-block; margin-top: 12px; color: #0284c7; font-weight: bold; text-decoration: none; font-size: 0.9rem; }
        .review-link:hover { text-decoration: underline; }
    </style>

    <!-- Cargador oficial de Google Maps JS API -->
    <script>
        (g=>{var h,a,k,p="The Google Maps JavaScript API",c="google",l="importLibrary",q="__ib__",m=document,b=window;b=b[c]||(b[c]={});var d=b.maps||(b.maps={}),r=new Set,e=new URLSearchParams,u=()=>h||(h=new Promise(async(f,n)=>{await (a=m.createElement("script"));e.set("libraries",[...r]+"");for(k in g)e.set(k.replace(/[A-Z]/g,t=>"_"+t[0].toLowerCase()),g[k]);e.set("callback",c+".maps."+q);a.src=`https://maps.${c}apis.com/maps/api/js?`+e;d[q]=f;a.onerror=()=>h=n(Error(p+" could not load."));a.nonce=m.querySelector("script[nonce]")?.nonce||"";m.head.append(a)}));d[l]?console.warn(p+" only loads once. Ignoring:",g):d[l]=(f,...n)=>r.add(f)&&u().then(()=>d[l](f,...n))})({
            key: "AIzaSyD4wKfBlYgwZql-jY6UBvRihfy4bEXYtus", // 👈 REEMPLAZA ÚNICAMENTE ESTE TEXTO CON TU API KEY
            v: "weekly"
        });
    </script>
</head>
<body>

    <div class="header-bar">
        <h2>Obtener Place ID</h2>
        <a href="index.html" class="btn-back">&larr; Volver al Inicio</a>
    </div>

    <div class="container">
        <!-- Campo de búsqueda del componente moderno de Places -->
        <div class="search-container" id="search-box"></div>

        <!-- Mapa -->
        <div id="map"></div>

        <!-- Panel de información lateral -->
        <div class="sidebar">
            <div class="info-card">
                <h3 id="place-name">Busca un negocio...</h3>
                <p id="place-address" style="color: #64748b; font-size: 0.85rem; margin-top: 6px; margin-bottom: 12px;"></p>
                <label style="font-size: 0.85rem; font-weight: 600; color: #334155;">Place ID del negocio:</label>
                <div class="place-id-box" id="place-id">Aún no seleccionado</div>
                <a id="review-url" href="#" target="_blank" class="review-link" style="display: none;">🔗 Probar enlace de reseña</a>
            </div>
        </div>
    </div>

    <script type="module">
        // Remplaza únicamente la función e inicialización dentro del script tipo module:

async function init() {
    const { Map } = await google.maps.importLibrary("maps");
    const { Place, PlaceAutocompleteElement } = await google.maps.importLibrary("places");
    const { AdvancedMarkerElement } = await google.maps.importLibrary("marker");

    const defaultLocation = { lat: 20.6597, lng: -103.3496 };
    const map = new Map(document.getElementById("map"), {
        center: defaultLocation,
        zoom: 13,
        mapId: "DEMO_MAP_ID"
    });

    const autocomplete = new PlaceAutocompleteElement();
    document.getElementById("search-box").appendChild(autocomplete);

    const marker = new AdvancedMarkerElement({ map });

    // Función principal para consultar y llenar los datos
    async function processPlace(placeObj) {
        try {
            // Solicitar los campos necesarios
            await placeObj.fetchFields({
                fields: ["id", "displayName", "formattedAddress", "location"]
            });

            if (placeObj.location) {
                map.setCenter(placeObj.location);
                map.setZoom(17);
                marker.position = placeObj.location;
            }

            // Actualizar la interfaz lateral
            document.getElementById("place-name").textContent = placeObj.displayName || "Sin nombre";
            document.getElementById("place-address").textContent = placeObj.formattedAddress || "";
            document.getElementById("place-id").textContent = placeObj.id || "No disponible";

            if (placeObj.id) {
                const reviewUrl = `https://search.google.com/local/writereview?placeid=${placeObj.id}`;
                const reviewLink = document.getElementById("review-url");
                reviewLink.href = reviewUrl;
                reviewLink.style.display = "inline-block";
            }
        } catch (error) {
            console.error("Error obteniendo datos del lugar:", error);
        }
    }

    // Listener para la selección del desplegable
    autocomplete.addEventListener("gmp-placeselect", async (event) => {
        let selectedPlace = event.place;

        // Si event.place no es una instancia con fetchFields, lo instanciamos con el ID
        if (selectedPlace && selectedPlace.id) {
            const place = new Place({ id: selectedPlace.id });
            await processPlace(place);
        } else if (event.detail && event.detail.place) {
            const place = new Place({ id: event.detail.place.id });
            await processPlace(place);
        }
    });

    // Listener para clics directos sobre iconos o puntos del mapa
    map.addListener("click", async (event) => {
        if (event.placeId) {
            event.stop();
            const place = new Place({ id: event.placeId });
            await processPlace(place);
        }
    });
}

init();
    </script>
</body>
</html>
